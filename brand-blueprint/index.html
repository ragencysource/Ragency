<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Information Questionnaire - Ragency.id</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0077FF;
            --dark-blue: #1e3c72;
            --light-blue: #2a5298;
            --text-dark: #111827;
            --text-light: #4B5563;
            --bg-input: #F9FAFB;
            --border-color: #D1D5DB;
            --bg-card: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--light-blue) 100%);
            background-attachment: fixed;
            padding: 40px 20px;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: clamp(30px, 5vw, 50px);
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        header h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark-blue);
        }

        header p {
            font-size: 1rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }

        fieldset {
            border: none;
            margin-bottom: 30px;
        }

        legend {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text-dark);
            width: 100%;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            background-color: var(--bg-input);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0, 119, 255, 0.2);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        small {
            display: block;
            margin-top: 8px;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .submit-btn:hover {
            background-color: #005fcc;
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
            transform: none;
        }
        
        #form-status {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <header id="form-header">
            <h1>Brand Information Questionnaire</h1>
            <p>Informasi ini akan menjadi fondasi utama bagi strategi yang akan kita bangun bersama.</p>
        </header>

        <form id="brand-form" action="https://formspree.io/f/mrblepjo" method="POST">

            <!-- Data Kontak (Wajib untuk notifikasi Formspree) -->
            <fieldset>
                <legend>Informasi Kontak</legend>
                <div class="form-group">
                    <label for="contact-email">Email Anda</label>
                    <input type="email" id="contact-email" name="email" placeholder="nama@perusahaan.com" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Bagian 1: Fondasi & Visi Bisnis</legend>
                <div class="form-group">
                    <label for="brand-name">Nama Brand</label>
                    <input type="text" id="brand-name" name="Nama Brand" placeholder="Apa nama resmi bisnis Anda?" required>
                </div>
                <div class="form-group">
                    <label for="brand-story">Latar Belakang / Cerita Brand</label>
                    <textarea id="brand-story" name="Cerita Brand" placeholder="Apa cerita atau inspirasi utama di balik pendirian bisnis ini?" required></textarea>
                </div>
                <div class="form-group">
                    <label for="industry">Industri</label>
                    <input type="text" id="industry" name="Industri" placeholder="Contoh: F&B, Fashion, Jasa, Teknologi, dll." required>
                </div>
                <div class="form-group">
                    <label for="brand-mission">Misi Brand (Sekarang)</label>
                    <textarea id="brand-mission" name="Misi Brand" placeholder="Apa yang bisnis ini sediakan untuk pelanggan setiap harinya?" required></textarea>
                </div>
                <div class="form-group">
                    <label for="brand-vision">Visi Brand (Masa Depan)</label>
                    <textarea id="brand-vision" name="Visi Brand" placeholder="Dalam 3-5 tahun, bisnis ini ingin dikenal sebagai apa?" required></textarea>
                </div>
                <div class="form-group">
                    <label for="core-values">Nilai Inti (Core Values)</label>
                    <textarea id="core-values" name="Nilai Inti" placeholder="Sebutkan 3-5 nilai yang menjadi pegangan utama brand." required></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Bagian 2: Produk & Keunggulan</legend>
                <div class="form-group">
                    <label for="products-services">Produk/Layanan Utama</label>
                    <textarea id="products-services" name="Produk/Layanan Utama" placeholder="Sebutkan produk atau layanan utama yang ditawarkan." required></textarea>
                </div>
                <div class="form-group">
                    <label for="problem-solved">Masalah yang Diselesaikan</label>
                    <textarea id="problem-solved" name="Masalah yang Diselesaikan" placeholder="Masalah spesifik apa yang diselesaikan?" required></textarea>
                </div>
                <div class="form-group">
                    <label for="usp">Keunggulan Unik (USP)</label>
                    <textarea id="usp" name="Keunggulan Unik (USP)" placeholder="Apa keunggulan utama dibanding kompetitor?" required></textarea>
                </div>
                <div class="form-group">
                    <label for="pricing-strategy">Strategi Harga</label>
                    <select id="pricing-strategy" name="Strategi Harga" required>
                        <option value="" disabled selected>Pilih posisi harga...</option>
                        <option value="Premium">Premium (Harga di atas rata-rata)</option>
                        <option value="Tengah">Tengah (Seimbang antara kualitas dan harga)</option>
                        <option value="Terjangkau">Terjangkau (Harga di bawah rata-rata)</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Bagian 3: Target Audiens Ideal</legend>
                 <div class="form-group">
                    <label for="age-range">Rentang Usia</label>
                    <input type="text" id="age-range" name="Rentang Usia" placeholder="Contoh: 18–35 tahun">
                </div>
                 <div class="form-group">
                    <label for="gender">Jenis Kelamin</label>
                    <input type="text" id="gender" name="Jenis Kelamin" placeholder="Contoh: Pria & Wanita">
                </div>
                 <div class="form-group">
                    <label for="location">Lokasi/Kota Target</label>
                    <input type="text" id="location" name="Lokasi Target" placeholder="Contoh: Surabaya, Sidoarjo">
                </div>
                 <div class="form-group">
                    <label for="profession">Profesi/Status</label>
                    <input type="text" id="profession" name="Profesi/Status" placeholder="Contoh: Pelajar, pekerja kantor">
                </div>
                <div class="form-group">
                    <label for="lifestyle">Psikografi (Gaya Hidup & Kebiasaan)</label>
                    <textarea id="lifestyle" name="Gaya Hidup & Kebiasaan" placeholder="Jelaskan kebiasaan belanja, media sosial, dll."></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Bagian 4: Peta Persaingan</legend>
                <div class="form-group">
                    <label for="competitors">Kompetitor Utama</label>
                    <textarea id="competitors" name="Kompetitor Utama"></textarea>
                </div>
                <div class="form-group">
                    <label for="benchmark-brands">Brand Panutan (Benchmark)</label>
                    <textarea id="benchmark-brands" name="Brand Panutan"></textarea>
                </div>
                <div class="form-group">
                    <label for="competitor-analysis">Kelebihan & Kekurangan Kompetitor</label>
                    <textarea id="competitor-analysis" name="Analisis Kompetitor"></textarea>
                </div>
            </fieldset>
            
            <fieldset>
                <legend>Bagian 5: Kepribadian & Gaya Merek</legend>
                 <div class="form-group">
                    <label for="brand-personality">Kepribadian Brand</label>
                    <input type="text" id="brand-personality" name="Kepribadian Brand" placeholder="3-5 kata sifat">
                </div>
                 <div class="form-group">
                    <label for="tone-of-voice">Gaya Komunikasi (Tone of Voice)</label>
                    <input type="text" id="tone-of-voice" name="Gaya Komunikasi" placeholder="Contoh: Informatif, Bersahabat">
                </div>
                 <div class="form-group">
                    <label for="visual-prefs">Preferensi Visual</label>
                    <textarea id="visual-prefs" name="Preferensi Visual" placeholder="Warna, logo, atau tema visual yang diinginkan"></textarea>
                </div>
            </fieldset>

            <button type="submit" id="submit-btn" class="submit-btn">Kirim Informasi Brand</button>
        </form>

        <!-- Penampung status diletakkan di luar form agar tidak ikut tersembunyi -->
        <div id="form-container-status">
            <p id="form-status"></p>
        </div>
    </div>
    
    <script>
        const form = document.getElementById("brand-form");
        const submitBtn = document.getElementById("submit-btn");
        const status = document.getElementById("form-status");
        const header = document.getElementById("form-header");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Mengirim...";
            status.innerHTML = "";

            const data = new FormData(event.target);

            try {
                const response = await fetch(event.target.action, {
                    method: form.method,
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    form.style.display = "none";
                    header.style.display = "none";
                    status.innerHTML = "✅<br><br><strong>Terima kasih!</strong><br>Informasi brand Anda berhasil kami terima.";
                    status.style.color = "var(--dark-blue)";
                } else {
                    const result = await response.json().catch(() => null);
                    if (result && result.errors && result.errors.length > 0) {
                        status.innerHTML = result.errors.map(err => err.message).join("<br>");
                    } else if (response.status === 404) {
                        status.innerHTML = "Error 404: Endpoint Formspree tidak ditemukan. Cek kembali Form ID Anda.";
                    } else {
                        status.innerHTML = "Oops! Gagal mengirim formulir (Status: " + response.status + ").";
                    }
                    status.style.color = "#D92D20";
                }
            } catch (error) {
                console.error("Submission Error:", error);
                status.innerHTML = "Gagal terhubung ke server. Pastikan Anda tidak membuka file ini langsung via file://, melainkan via localhost/web server.";
                status.style.color = "#D92D20";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Kirim Informasi Brand";
            }
        });
    </script>
</body>
</html>
